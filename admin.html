<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Worker Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2, h3 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="number"], input[type="email"], input[type="password"], input[type="month"], select { 
            width: 95%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; 
        }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; margin-bottom: 20px; }
        button:hover { background-color: #218838; }
        .divider { border-top: 2px solid #eee; margin: 25px 0; }
        
        /* Hide dashboard until logged in */
        #dashboardSection { display: none; }
        #loginError { color: red; text-align: center; display: none; font-size: 14px; margin-top: 10px; }
        .logout-btn { background-color: #dc3545; margin-top: 0; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="loginSection">
        <h2>Admin Login</h2>
        <p style="text-align:center; font-size:12px; color:#666;">Enter your admin email and password.</p>
        
        <div class="input-group">
            <label>Admin Email:</label>
            <input type="email" id="loginEmail" placeholder="e.g. samoresh@admin.com">
        </div>
        <div class="input-group">
            <label>Password:</label>
            <input type="password" id="loginPassword" placeholder="Enter Password">
        </div>
        <button id="loginBtn">Login</button>
        <div id="loginError">Incorrect email or password.</div>
    </div>

    <div id="dashboardSection">
        <h2>Admin Dashboard</h2>
        <button id="logoutBtn" class="logout-btn">Log Out</button>

        <div class="divider"></div>

        <h3>Add New Member</h3>
        <div class="input-group">
            <label>Name:</label>
            <input type="text" id="newWorkerName" placeholder="Worker Name">
        </div>
        <div class="input-group">
            <label>Type:</label>
            <select id="newWorkerType">
                <option value="Mistri">Mistri</option>
                <option value="Labour">Labour</option>
            </select>
        </div>
        <div class="input-group">
            <label>Daily Salary (₹):</label>
            <input type="number" id="newWorkerSalary" placeholder="e.g. 650">
        </div>
        <div class="input-group">
            <label>Extra Hour Salary (₹):</label>
            <input type="number" id="newWorkerExtraRate" placeholder="e.g. 15">
        </div>
        <button id="addWorkerBtn">Save Member to Database</button>

        <div class="divider"></div>

        <h3>Fill Monthly Data</h3>
        <div class="input-group">
            <label>Worker Name:</label>
            <input type="text" id="dataName" placeholder="Must match exact name">
        </div>
        <div class="input-group">
            <label>Year / Month:</label>
            <input type="month" id="dataMonth">
        </div>
        <div class="input-group">
            <label>Total Working Days:</label>
            <input type="number" id="dataDays" placeholder="e.g. 20">
        </div>
        <div class="input-group">
            <label>Total Extra Hours:</label>
            <input type="number" id="dataExtraHrs" placeholder="e.g. 10">
        </div>
        <div class="input-group">
            <label>Expense (₹):</label>
            <input type="number" id="dataExpense" placeholder="e.g. 7000">
        </div>
        <div class="input-group">
            <label>Paid (₹):</label>
            <input type="number" id="dataPaid" placeholder="Amount already given">
        </div>
        <button id="saveDataBtn">Submit Monthly Data</button>

    </div>
</div>

<script type="module">
    // 1. Import Firebase Auth and Firestore
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. ⚠️ PASTE YOUR FIREBASE CONFIG HERE ⚠️
  const firebaseConfig = {
  apiKey: "AIzaSyDDMlYKDvkjmmdbA8-bFzOeik4q0q-bfEI",
  authDomain: "worker-manager-7d563.firebaseapp.com",
  projectId: "worker-manager-7d563",
  storageBucket: "worker-manager-7d563.firebasestorage.app",
  messagingSenderId: "182636263301",
  appId: "1:182636263301:web:d628c9f2d298a4f554f6ec"
};

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI Elements
    const loginSection = document.getElementById('loginSection');
    const dashboardSection = document.getElementById('dashboardSection');

    // 4. Security Check: Are they logged in?
    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Logged in! Show Dashboard
            loginSection.style.display = 'none';
            dashboardSection.style.display = 'block';
        } else {
            // Not logged in! Show Login Screen
            loginSection.style.display = 'block';
            dashboardSection.style.display = 'none';
        }
    });

    // 5. Login Button Logic
    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value;
        const pass = document.getElementById('loginPassword').value;
        
        signInWithEmailAndPassword(auth, email, pass)
            .then(() => { document.getElementById('loginError').style.display = 'none'; })
            .catch((error) => { document.getElementById('loginError').style.display = 'block'; });
    });

    // 6. Logout Button Logic
    document.getElementById('logoutBtn').addEventListener('click', () => {
        signOut(auth);
    });

    // 7. Add New Worker Logic
    document.getElementById('addWorkerBtn').addEventListener('click', async () => {
        const name = document.getElementById('newWorkerName').value.trim();
        const type = document.getElementById('newWorkerType').value;
        const salary = document.getElementById('newWorkerSalary').value;
        const extraRate = document.getElementById('newWorkerExtraRate').value;

        if(!name || !salary) return alert("Please fill in Name and Salary!");

        try {
            await addDoc(collection(db, "workers"), {
                name: name,
                type: type,
                daily_salary: Number(salary),
                extra_hour_rate: Number(extraRate)
            });
            alert(name + " added successfully!");
            document.getElementById('newWorkerName').value = '';
            document.getElementById('newWorkerSalary').value = '';
            document.getElementById('newWorkerExtraRate').value = '';
        } catch (e) {
            alert("Error adding worker: " + e.message);
        }
    });

    // 8. Add Monthly Data Logic
    document.getElementById('saveDataBtn').addEventListener('click', async () => {
        const name = document.getElementById('dataName').value.trim();
        const month = document.getElementById('dataMonth').value;
        const days = document.getElementById('dataDays').value;
        const extraHrs = document.getElementById('dataExtraHrs').value;
        const expense = document.getElementById('dataExpense').value;
        const paid = document.getElementById('dataPaid').value;

        if(!name || !month) return alert("Worker Name and Month are required!");

        try {
            await addDoc(collection(db, "attendance_records"), {
                name: name,
                month: month,
                working_days: Number(days),
                extra_hours: Number(extraHrs),
                expense: Number(expense),
                paid: Number(paid)
            });
            alert("Data saved for " + name + "!");
            // Clear form
            document.getElementById('dataName').value = '';
            document.getElementById('dataDays').value = '';
            document.getElementById('dataExtraHrs').value = '';
            document.getElementById('dataExpense').value = '';
            document.getElementById('dataPaid').value = '';
        } catch (e) {
            alert("Error saving data: " + e.message);
        }
    });
</script>
</body>
</html>
