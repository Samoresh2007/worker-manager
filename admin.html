<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin System Panel</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; margin: 0; padding: 15px; }
        .container { max-width: 550px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { color: #1e293b; margin-top: 0; }
        .section-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        label { font-weight: 600; font-size: 13px; color: #475569; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 15px; font-size: 15px; outline: none; background: white; }
        input:focus, select:focus { border-color: #0d9488; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; color: white; transition: 0.2s; }
        .btn-teal { background: #0d9488; } .btn-teal:hover { background: #0f766e; }
        .btn-blue { background: #3b82f6; } .btn-blue:hover { background: #2563eb; }
        .btn-red { background: #ef4444; } .btn-red:hover { background: #dc2626; }
        .btn-logout { background: #64748b; margin-bottom: 20px; }
        
        .autocomplete-container { position: relative; width: 100%; }
        .autocomplete-items { position: absolute; border: 1px solid #cbd5e1; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; background: #fff; border-radius: 0 0 6px 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-height: 150px; overflow-y: auto; }
        .autocomplete-items:empty { display: none; }
        .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .autocomplete-items div:hover { background-color: #f0fdfa; color: #0d9488; font-weight: bold; }

        .slider-box { display: flex; align-items: center; gap: 15px; background: #f1f5f9; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
        .slider-box input { margin-bottom: 0; cursor: pointer; }

        .record-item { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
        #dashboardSection { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN -->
    <div id="loginSection">
        <h2>Admin Authentication</h2>
        <label>Admin Email:</label>
        <input type="email" id="loginEmail" placeholder="admin@domain.com">
        <label>Password:</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
        <button class="btn-teal" id="loginBtn">Unlock Workspace</button>
        <p id="loginError" style="color:red; display:none; font-size: 13px; text-align: center;">Invalid admin access credentials.</p>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboardSection">
        <h2>Workspace Dashboard</h2>
        <button class="btn-logout" id="logoutBtn">Lock Console Session</button>

        <!-- 1. DYNAMIC DOCUMENT REGISTRY SYSTEM WITH EXTRA INPUT FIELDS FOR CLASSIFICATION -->
        <div class="section-box" style="border-left: 4px solid #0d9488;">
            <h3>📤 Upload Vault Document</h3>
            <label>Holder Name:</label>
            <div class="autocomplete-container">
                <input type="text" id="docName" autocomplete="off" placeholder="e.g. Swapan Dey">
                <div id="docNameList" class="autocomplete-items"></div>
            </div>

            <label>Card Classification Category:</label>
            <select id="docCardType">
                <option value="Aadhar">Aadhar Card</option>
                <option value="Voter">Voter ID Card</option>
                <option value="Bank">Bank Account</option>
                <option value="Other">Other Document</option>
            </select>

            <!-- Conditional Display field block inputs -->
            <div id="bankSelectionWrapper" style="display: none;">
                <label>Specify Bank Name:</label>
                <input type="text" id="txtBankSelectorName" placeholder="e.g. State Bank of India">
            </div>

            <div id="customDocSelectionWrapper" style="display: none;">
                <label>Specify Document Custom Label Name:</label>
                <input type="text" id="txtCustomDocLabel" placeholder="e.g. Driving License / Pan Card">
            </div>

            <label>Card / Account Identification Number:</label>
            <input type="text" id="docNumber" placeholder="Enter Unique ID/Acc Code">

            <label>Select Digital Attachment (JPG / PNG / PDF):</label>
            <input type="file" id="docFile" accept="image/*,application/pdf">

            <label>Edit KB Quality (Image Size Tuning):</label>
            <div class="slider-box">
                <input type="range" id="kbCompressorSlider" min="10" max="100" value="60">
                <span id="lblKbValue" style="font-weight: bold; font-size: 14px; color:#0d9488;">60%</span>
            </div>
            
            <button class="btn-teal" id="uploadBtn">Process & Store To Vault</button>
        </div>

        <!-- 2. TRACKING ADJUSTMENTS - WITH ONE-CLICK AUTO WEEKEMI DECREMENT SYSTEM -->
        <div class="section-box" style="border-left: 4px solid #3b82f6; background:#eff6ff;">
            <h3 style="color:#1d4ed8;">📉 Process Active EMI Payment</h3>
            <p style="font-size: 12px; color:#1e40af; margin-top:-10px; margin-bottom:15px;">Clicking this button automatically deducts 1 week from your outstanding EMI totals down to 48, 47, etc.</p>
            <button class="btn-blue" id="btnQuickEMIDeduct" style="background:#1d4ed8;">Record Weekly Paid EMI (-1 Week)</button>
            
            <div style="border-top: 1.5px dashed #bfdbfe; margin:20px 0 15px 0;"></div>
            
            <label>Or Manually Override Remaining EMI Count:</label>
            <input type="number" id="txtAdminEmis" placeholder="Change specific week count number manually">
            <button class="btn-blue" id="updateLoanBtn">Commit Manual Overwrite</button>
        </div>

        <!-- 3. ATTACHMENT ENTRIES REMOVAL DISPLAY ROSTER -->
        <div class="section-box">
            <h3>⚙️ Active Repository Indexes</h3>
            <div id="vaultRosterList"></div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // ⚠️ PASTE YOUR FIREBASE CONFIG HERE ⚠️
    const firebaseConfig = {
  apiKey: "AIzaSyDDMlYKDvkjmmdbA8-bFzOeik4q0q-bfEI",
  authDomain: "worker-manager-7d563.firebaseapp.com",
  projectId: "worker-manager-7d563",
  storageBucket: "worker-manager-7d563.firebasestorage.app",
  messagingSenderId: "182636263301",
  appId: "1:182636263301:web:d628c9f2d298a4f554f6ec"
};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let adminNamesAutocompleteList = [];

    function registerAutocomplete(inputId, dropdownId) {
        const inp = document.getElementById(inputId);
        const list = document.getElementById(dropdownId);
        inp.addEventListener('input', function() {
            const val = this.value.toLowerCase();
            list.innerHTML = ''; if(!val) return;
            const matches = adminNamesAutocompleteList.filter(name => name.toLowerCase().includes(val));
            matches.forEach(match => {
                const item = document.createElement('div');
                item.innerText = match;
                item.addEventListener('click', () => { inp.value = match; list.innerHTML = ''; });
                list.appendChild(item);
            });
        });
        document.addEventListener('click', (e) => { if(e.target !== inp) list.innerHTML = ''; });
    }
    registerAutocomplete('docName', 'docNameList');

    // Dynamic visibility UI logic configurations matching subfield input forms
    const docCardTypeSelector = document.getElementById('docCardType');
    docCardTypeSelector.addEventListener('change', function() {
        document.getElementById('bankSelectionWrapper').style.display = (this.value === 'Bank') ? 'block' : 'none';
        document.getElementById('customDocSelectionWrapper').style.display = (this.value === 'Other') ? 'block' : 'none';
    });

    const slider = document.getElementById('kbCompressorSlider');
    slider.addEventListener('input', (e) => { document.getElementById('lblKbValue').innerText = e.target.value + "%"; });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            loadActiveDocumentsIndex();
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'none';
        }
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
        signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
            .catch(() => document.getElementById('loginError').style.display = 'block');
    });
    document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

    async function loadActiveDocumentsIndex() {
        const container = document.getElementById('vaultRosterList');
        container.innerHTML = ''; adminNamesAutocompleteList = [];
        
        const snap = await getDocs(collection(db, "vault_documents"));
        snap.forEach(docSnapshot => {
            const d = docSnapshot.data();
            const docId = docSnapshot.id;
            if(!adminNamesAutocompleteList.includes(d.name)) adminNamesAutocompleteList.push(d.name);

            const row = document.createElement('div');
            row.className = 'record-item';
            row.innerHTML = `
                <div><b>${d.name}</b> - ${d.card_type} (<small>${d.card_number}</small>)</div>
                <button class="btn-red del-doc-btn" style="width:auto; padding:6px 12px; font-size:12px;" data-id="${docId}">Remove</button>
            `;
            container.appendChild(row);
        });

        document.querySelectorAll('.del-doc-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                if(confirm("Confirm deletion of file asset registry index row?")) {
                    await deleteDoc(doc(db, "vault_documents", e.target.getAttribute('data-id')));
                    loadActiveDocumentsIndex();
                }
            });
        });
    }

    // Processing storage conversions mapping categories safely across database fields
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const name = document.getElementById('docName').value.trim();
        const categorySelection = docCardTypeSelector.value;
        const cardNumber = document.getElementById('docNumber').value.trim();
        const fileSelector = document.getElementById('docFile').files[0];

        if(!name || !cardNumber || !fileSelector) return alert("All fields must be fully populated!");

        // Dynamic naming logic structures
        let finalCardTypeLabel = "";
        if(categorySelection === "Aadhar") finalCardTypeLabel = "Aadhar Card";
        else if(categorySelection === "Voter") finalCardTypeLabel = "Voter ID Card";
        else if(categorySelection === "Bank") {
            const bankNameInput = document.getElementById('txtBankSelectorName').value.trim();
            finalCardTypeLabel = bankNameInput ? `Bank: ${bankNameInput}` : "Bank Account";
        } else {
            const customInputLabel = document.getElementById('txtCustomDocLabel').value.trim();
            finalCardTypeLabel = customInputLabel ? customInputLabel : "Other Document";
        }

        const fileReader = new FileReader();

        if (fileSelector.type === "application/pdf") {
            if (fileSelector.size > 750000) return alert("PDF exceeds 750KB limit payload boundary. Please compress before processing.");
            
            fileReader.readAsDataURL(fileSelector);
            fileReader.onload = async function() {
                await commitDocumentDataToFirestore(name, categorySelection, finalCardTypeLabel, cardNumber, fileReader.result);
            };
        } else {
            fileReader.readAsDataURL(fileSelector);
            fileReader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    const qualityFactor = Number(slider.value) / 100;
                    const compressedBase64 = canvas.toDataURL('image/jpeg', qualityFactor);
                    
                    await commitDocumentDataToFirestore(name, categorySelection, finalCardTypeLabel, cardNumber, compressedBase64);
                };
            };
        }
    });

    async function commitDocumentDataToFirestore(name, structuralCategory, computedLabel, cardNumber, base64TextString) {
        try {
            if (base64TextString.length > 1300000) return alert("Payload sizes boundary limit exceeded! Reduce Edit KB slider scale factors.");
            
            await addDoc(collection(db, "vault_documents"), {
                name: name,
                doc_category: structuralCategory, // Saves base identifier string for exact frontend filter searches
                card_type: computedLabel,
                card_number: cardNumber,
                file_base64: base64TextString
            });
            alert("File upload completed successfully!");
            document.getElementById('docNumber').value = '';
            document.getElementById('docFile').value = '';
            document.getElementById('txtBankSelectorName').value = '';
            document.getElementById('txtCustomDocLabel').value = '';
            loadActiveDocumentsIndex();
        } catch(e) { alert("Error writing registry entries: " + e.message); }
    }

    // 🔴 ONE-CLICK AUTO WEEK EMI DECREMENT WORKFLOW FUNCTIONALITY 🔴
    document.getElementById('btnQuickEMIDeduct').addEventListener('click', async () => {
        try {
            const querySnap = await getDocs(collection(db, "loan_status"));
            let currentRemainingWeeks = 40;
            
            if(!querySnap.empty) {
                currentRemainingWeeks = Number(querySnap.docs[0].data().remaining_emis) || 0;
            }
            
            if(currentRemainingWeeks <= 0) {
                return alert("Outstanding EMI totals are already down to zero weeks!");
            }
            
            const decrementedNewTotal = currentRemainingWeeks - 1;
            await setDoc(doc(db, "loan_status", "active_config"), { remaining_emis: decrementedNewTotal });
            
            alert(`EMI payment logged successfully! Outstanding balance reduced from ${currentRemainingWeeks} weeks down to ${decrementedNewTotal} weeks.`);
        } catch(e) {
            alert("Error running automatic decrement background update processing: " + e.message);
        }
    });

    document.getElementById('updateLoanBtn').addEventListener('click', async () => {
        const emis = Number(document.getElementById('txtAdminEmis').value);
        if(!emis && emis !== 0) return alert("Please specify a manual numeric entry value override target!");

        try {
            await setDoc(doc(db, "loan_status", "active_config"), { remaining_emis: emis });
            alert("Roster loan metrics count configuration values overwritten successfully!");
            document.getElementById('txtAdminEmis').value = '';
        } catch(e) { alert("Error executing database modifications: " + e.message); }
    });
</script>
</body>
</html>
